<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cactus Trading — Trade smarter. Trade faster.</title>
<style>
  :root {
    --accent:       #5fa37e;
    --ink:          #f3f6fc;
    --soft:         rgba(243,246,252,0.74);
    --mute:         rgba(243,246,252,0.5);
    --bg:           #000000;

    --beam:         320px;   /* hover-beam radius (tweakable) */
    --lift:         70;      /* 3D lift amount 0–100 (tweakable) */
    --density:      26;      /* arrow grid spacing px (tweakable) */

    --font-display: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --display-weight: 600;
    --display-tracking: -0.03em;
    --display-leading: 1.0;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }

  /* ============ shader background (canvas) ============ */
  #bg {
    position: fixed; inset: 0; z-index: 0;
    display: block; width: 100%; height: 100%;
    background: #0d0d0d;
  }

  /* soft dark cushion so the headline stays readable when the beam passes under it */
  .scrim {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(58% 50% at 50% 47%, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.35) 48%, transparent 76%);
  }

  /* ============ hero ============ */
  .hero {
    position: relative; z-index: 3;
    height: 100svh;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(28px, 5vw, 64px);
  }
  .stage { max-width: 880px; width: 100%; text-align: center; }

  .headline {
    font-family: var(--font-display);
    font-weight: var(--display-weight);
    line-height: 1.14;
    letter-spacing: var(--display-tracking);
    font-size: clamp(46px, 8.4vw, 124px);
    text-wrap: balance;
    padding-bottom: 0.06em;
    margin-bottom: clamp(18px, 3vh, 30px);
    /* brushed-silver / liquid-chrome fill to match the background */
    background: linear-gradient(176deg,
      #ffffff 0%, #e8ebef 26%, #aab0b8 46%,
      #7d838c 52%, #d5dae0 60%, #f4f6f8 74%, #b9c0c8 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 2px 26px rgba(0,0,0,0.75));
  }
  .headline .cactus-mark {
    display: inline-block; width: 0.62em; height: 0.9em;
    margin-left: 0.16em; vertical-align: middle; position: relative; top: -0.05em;
    color: var(--accent); -webkit-text-fill-color: var(--accent);
  }
  .headline .cactus-mark svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 18px rgba(95,163,126,0.5)); }
  .slogan {
    font-size: clamp(15px, 1.65vw, 20px);
    font-weight: 400; line-height: 1.45;
    color: var(--soft);
    max-width: 600px; margin: 0 auto clamp(28px, 5vh, 46px);
    letter-spacing: -0.01em; text-wrap: balance;
    text-shadow: 0 1px 22px rgba(0,0,0,0.9);
  }
  .slogan b { color: var(--ink); font-weight: 600; }

  /* ---------- CTA (join) ---------- */
  .waitlist { max-width: 600px; margin: 0 auto; }
  .cta-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 12px;
    background: linear-gradient(176deg,
      rgba(244,246,245,0.55) 0%, rgba(217,223,219,0.5) 24%, rgba(169,179,172,0.45) 46%,
      rgba(131,141,133,0.45) 52%, rgba(196,204,198,0.5) 62%, rgba(238,241,239,0.55) 78%, rgba(183,192,186,0.5) 100%);
    color: rgba(28,35,30,0.98);
    border: 1px solid rgba(255,255,255,0.22); border-radius: 999px;
    font-family: inherit; font-weight: 600; font-size: 16px; letter-spacing: -0.01em;
    padding: 17px 34px; cursor: pointer; white-space: nowrap;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    transition: border-color 0.28s ease, box-shadow 0.32s ease, filter 0.28s ease, transform 0.2s ease;
  }
  .cta-btn:hover, .cta-btn:focus-visible {
    outline: none; filter: brightness(1.06); border-color: rgba(255,255,255,0.36);
    box-shadow:
      inset 0 0 8px rgba(255,255,255,0.2),
      0 0 0 1px rgba(200,214,204,0.4),
      0 0 10px 1px rgba(200,214,204,0.28),
      0 0 20px 3px rgba(200,214,204,0.18),
      0 8px 22px rgba(0,0,0,0.35);
  }
  .cta-btn:active { transform: scale(0.97); }
  .cta-icon {
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 13px; height: 13px; border-radius: 50%;
    background: linear-gradient(176deg, #ffffff 0%, #e8ebef 26%, #aab0b8 50%, #7d838c 56%, #d5dae0 64%, #f4f6f8 82%, #b9c0c8 100%);
    box-shadow: 0 0 8px 1px rgba(210,218,222,0.5);
  }

  /* ---------- "sucked into the circle" exit transition ---------- */
  body.warping .stage { will-change: transform, opacity, filter; }
  body.warping .scrim { transition: opacity 0.7s ease; opacity: 0; }
  .suck-flash {
    position: fixed; inset: 0; z-index: 10; pointer-events: none; display: block;
    mix-blend-mode: screen;
  }

  /* ---------- join screen (same persistent canvas, second in-page state) ---------- */
  .join-screen {
    position: fixed; inset: 0; z-index: 4;
    display: flex; align-items: stretch; justify-content: flex-start;
    opacity: 0; pointer-events: none;
  }
  .join-screen.show { pointer-events: auto; }
  /* second-screen background: soft green/silver gradient with a very subtle
     drift — replaces the WebGL circles on this screen (opaque, so they're hidden) */
  .join-bg {
    position: absolute; inset: 0; z-index: 0; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #16231d 0%, #0e1620 55%, #0a0e15 100%);
  }
  .join-bg::before {
    content: ""; position: absolute; inset: -35%;
    background:
      radial-gradient(closest-side at 30% 32%, rgba(95,163,126,0.42), transparent 100%),
      radial-gradient(closest-side at 72% 62%, rgba(200,214,206,0.30), transparent 100%),
      radial-gradient(closest-side at 58% 22%, rgba(126,146,138,0.24), transparent 100%),
      radial-gradient(closest-side at 40% 78%, rgba(95,163,126,0.22), transparent 100%);
    filter: blur(60px);
    animation: joinDrift 32s ease-in-out infinite alternate,
               joinPulse 4.8s ease-in-out infinite;
    will-change: transform, opacity;
  }
  @keyframes joinDrift {
    from { transform: translate3d(-2.5%, -2%, 0) scale(1.06) rotate(0deg); }
    to   { transform: translate3d(2.5%, 2%, 0) scale(1.13) rotate(5deg); }
  }
  /* faint "heartbeat" — a gentle brightness breathing on top of the drift */
  @keyframes joinPulse {
    0%, 100% { opacity: 0.84; }
    50%      { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .join-bg::before { animation: none; } }
  .join-content {
    position: relative; z-index: 1;
    flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 32px;
  }
  .join-screen h2 {
    font-family: var(--font-display); font-weight: var(--display-weight);
    letter-spacing: var(--display-tracking);
    font-size: clamp(28px, 4vw, 44px); color: var(--ink);
    margin-bottom: 12px; text-shadow: 0 2px 40px rgba(0,0,0,0.85);
  }
  .join-screen p { color: var(--soft); font-size: 16px; text-shadow: 0 1px 20px rgba(0,0,0,0.85); }

  /* ---------- left panel: clean, minimal sidebar (Perplexity-like), sized to its icon row ---------- */
  .join-panel {
    position: relative; z-index: 1; flex: 0 0 auto; height: 100%;
    display: flex; flex-direction: column; align-items: flex-start;
    padding: 22px 18px 0;
    border-right: 1px solid rgba(230,238,232,0.12);
  }
  .join-panel { transition: padding 0.25s ease; }
  .panel-top { display: flex; align-items: center; gap: 12px; transition: gap 0.25s ease; }
  .join-panel .panel-icon { width: 22px; height: 22px; color: var(--soft); flex-shrink: 0; transition: width 0.25s ease, opacity 0.2s ease; overflow: hidden; }
  .join-panel .panel-icon svg { width: 100%; height: 100%; display: block; }
  .join-panel .panel-collapse { width: 19px; height: 19px; color: var(--soft); flex-shrink: 0; opacity: 0.7; cursor: pointer; pointer-events: auto; transition: opacity 0.2s ease; position: relative; }
  .join-panel .panel-collapse:hover { opacity: 1; }
  .join-panel .panel-collapse svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .join-panel .panel-collapse svg.ic-cactus { display: none; }
  .join-panel.collapsed .panel-top { gap: 0; }
  .join-panel.collapsed .panel-icon { width: 0; overflow: hidden; }
  .join-panel.collapsed .panel-collapse svg.ic-collapse { display: none; }
  .join-panel.collapsed .panel-collapse svg.ic-cactus { display: block; }
  .join-panel.collapsed .panel-collapse:hover svg.ic-collapse { display: block; }
  .join-panel.collapsed .panel-collapse:hover svg.ic-cactus { display: none; }

  /* hero content entrance — base state is VISIBLE; animate FROM hidden */
  .stage > * { opacity: 1; }
  body.revealed .stage > * { animation: reveal 0.9s cubic-bezier(.2,.7,.2,1) both; }
  body.revealed .stage > *:nth-child(1) { animation-delay: 0.05s; }
  body.revealed .stage > *:nth-child(2) { animation-delay: 0.16s; }
  body.revealed .stage > *:nth-child(3) { animation-delay: 0.28s; }
  @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .stage > * { opacity: 1 !important; transform: none !important; animation: none !important; } }

  /* ---------- ask bar (product prompt) — fixed bottom-center, follows on scroll ---------- */
  .prompt-bar {
    position: fixed; left: 50%; bottom: clamp(16px, 4vh, 30px);
    transform: translateX(-50%);
    width: min(680px, calc(100% - 32px));
    z-index: 40;
    display: flex; flex-direction: column; gap: 10px;
    opacity: 0; pointer-events: none;          /* hidden on the hero */
    transition: opacity 0.6s ease;
  }
  /* show the ask bar only on the second (join) screen */
  .join-screen.show ~ .prompt-bar { opacity: 1; pointer-events: auto; }

  .prompt-note {
    display: none;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 14px; padding: 13px 16px;
    color: var(--soft); font-size: 14px; line-height: 1.45; letter-spacing: -0.005em;
    -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  .prompt-note.show { display: block; animation: pop 0.4s ease; }
  .prompt-note b { color: var(--ink); font-weight: 600; }

  .prompt-row {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 16px; padding: 7px 7px 7px 18px;
    -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 10px 34px rgba(0,0,0,0.5);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .prompt-row:focus-within { border-color: rgba(255,255,255,0.3); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 0 0 3px rgba(95,163,126,0.18), 0 10px 34px rgba(0,0,0,0.5); }
  .prompt-input {
    flex: 1; min-width: 0; background: none; border: none; outline: none;
    color: var(--ink); font-family: inherit; font-size: 16px; letter-spacing: -0.01em; padding: 10px 0;
  }
  .prompt-input::placeholder { color: var(--mute); }
  .prompt-send {
    flex-shrink: 0; width: 40px; height: 40px; display: grid; place-items: center;
    border-radius: 12px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.22);
    background: linear-gradient(176deg,
      rgba(244,246,245,0.9) 0%, rgba(217,223,219,0.85) 24%, rgba(169,179,172,0.8) 46%,
      rgba(131,141,133,0.8) 52%, rgba(196,204,198,0.85) 62%, rgba(238,241,239,0.9) 78%, rgba(183,192,186,0.85) 100%);
    color: rgba(28,35,30,0.98);
    transition: filter 0.2s ease, box-shadow 0.28s ease, transform 0.15s ease;
  }
  .prompt-send svg { width: 18px; height: 18px; display: block; }
  .prompt-send:hover { filter: brightness(1.06); box-shadow: 0 0 0 1px rgba(95,163,126,0.5), 0 0 14px 2px rgba(95,163,126,0.35); }
  .prompt-send:active { transform: scale(0.94); }

  /* ---------- market cards (second screen, top-center; all shown, with sparklines) ---------- */
  .markets {
    position: fixed; top: clamp(14px, 3vh, 26px);
    left: 0; right: 0;
    /* clear the left nav rail so the first card doesn't slide under it */
    padding: 0 16px 0 76px;
    z-index: 40;
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.6s ease;
  }
  /* show only on the second (join) screen. The container stays pointer-events:none
     (its padding/gaps must not sit over the nav toggle); only the cards catch events. */
  .join-screen.show ~ .markets { opacity: 1; }
  .mkt-tile {
    pointer-events: auto;
    flex: 1 1 150px; min-width: 138px; max-width: 210px;
    display: flex; flex-direction: column; gap: 5px;
    padding: 11px 13px; border-radius: 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 10px 26px rgba(0,0,0,0.38);
  }
  /* symbol · price · change% — all on one line */
  .mkt-head { display: flex; align-items: baseline; gap: 7px; white-space: nowrap; }
  .mkt-label { color: var(--soft); font-size: 10.5px; letter-spacing: 0.03em; text-transform: uppercase; }
  .mkt-price { color: var(--ink); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .mkt-chg { margin-left: auto; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .mkt-chg.up { color: #4fd18b; }
  .mkt-chg.down { color: #ff6b6b; }
  .spark-wrap { position: relative; margin-top: 2px; }
  .mkt-spark { width: 100%; height: 34px; display: block; overflow: visible; }
  .spark-prev { stroke: #6ea8ff; stroke-width: 1; vector-effect: non-scaling-stroke; opacity: 0.85; stroke-dasharray: 2 3; }
  .spark-daybreak { stroke: rgba(208,214,220,0.65); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .spark-line { fill: none; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
  .spark-line.up { stroke: #4fd18b; }
  .spark-line.down { stroke: #ff6b6b; }
  /* pulsing dot at the latest point */
  .spark-dot { position: absolute; right: 1px; width: 6px; height: 6px; border-radius: 50%; transform: translate(50%, -50%); }
  .spark-dot.up { background: #4fd18b; }
  .spark-dot.down { background: #ff6b6b; }
  /* the pulse ring only renders when the market is open (.live) */
  .spark-dot.live::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%; background: inherit;
    animation: sparkPulse 1.8s ease-out infinite;
  }
  @keyframes sparkPulse { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(3.4); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .spark-dot.live::after { animation: none; } }
  .markets-empty { color: var(--mute); font-size: 12.5px; padding: 12px; }
</style>
</head>
<body>
  <!-- shader background -->
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="scrim" aria-hidden="true"></div>
  <canvas class="suck-flash" id="suckFlash" aria-hidden="true"></canvas>

  <!-- hero -->
  <main class="hero" data-screen-label="Hero">
    <section class="stage">
      <h1 class="headline"><span id="headline">Cactus Trading</span><span class="cactus-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22 L12 4.5" /><path d="M12 15 L8.2 15 L8.2 10.6" /><path d="M12 12 L15.8 12 L15.8 8" /></svg></span></h1>
      <p class="slogan">Why should you be held back by speed when the institutions aren't?</p>

      <div class="waitlist" id="waitlist">
        <button type="button" class="cta-btn" id="joinBtn">
          <span class="cta-icon" aria-hidden="true"></span>
          <span>Join top traders</span>
        </button>
      </div>
    </section>
  </main>

  <!-- join screen (revealed in-page after the CTA transition; same canvas, no reload) -->
  <section class="join-screen" id="joinScreen" data-screen-label="Join">
    <div class="join-bg" aria-hidden="true"></div>
    <aside class="join-panel collapsed" id="joinPanel">
      <div class="panel-top">
        <div class="panel-icon">
          <svg viewBox="0 1.25 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1.4 2.2">
            <path d="M12 22 L12 4.5" />
            <path d="M12 15 L8.2 15 L8.2 10.6" />
            <path d="M12 12 L15.8 12 L15.8 8" />
          </svg>
        </div>
        <div class="panel-collapse">
          <svg class="ic-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="5" width="17" height="14" rx="3" />
            <line x1="9.5" y1="5" x2="9.5" y2="19" />
          </svg>
          <svg class="ic-cactus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1.4 2.2">
            <path d="M12 22 L12 4.5" />
            <path d="M12 15 L8.2 15 L8.2 10.6" />
            <path d="M12 12 L15.8 12 L15.8 8" />
          </svg>
        </div>
      </div>
    </aside>
    <div class="join-content">
      <div>
        <h2>You're in.</h2>
        <p>This screen is a placeholder — we'll design the real one next.</p>
      </div>
    </div>
  </section>

  <!-- ask bar (fixed bottom-center; visual only for now — AI endpoint comes next) -->
  <form class="prompt-bar" id="askBar" autocomplete="off" aria-label="Ask Cactus">
    <div class="prompt-note" id="promptNote" role="status" aria-live="polite"></div>
    <div class="prompt-row">
      <input type="text" id="askInput" class="prompt-input" placeholder="Ask anything about the markets…" aria-label="Ask anything about the markets" />
      <button type="submit" class="prompt-send" aria-label="Ask">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 19 L12 5" />
          <path d="M6 11 L12 5 L18 11" />
        </svg>
      </button>
    </div>
  </form>

  <!-- market cards (second screen, top-center) -->
  <div class="markets" id="markets" aria-label="Market indices (delayed)">
    <div class="markets-empty">Loading markets…</div>
  </div>

  <script>
    /* ===========================================================
       Background — GPU noise field distorted by a soft circle +
       halo (WebGL). The distortion circle tracks the cursor.
       Ported 1:1 from the expo-gl shader (GLSL is identical).
       =========================================================== */
    (function () {
      var canvas = document.getElementById("bg");
      if (!canvas) return;
      var gl = canvas.getContext("webgl", { antialias: false, alpha: false })
            || canvas.getContext("experimental-webgl");
      if (!gl) { document.body.style.background = "#0d0d0d"; return; }

      var PARAMS = window.__bgParams = {
        cX: 0.5, cY: 0.5, cR: 150, feather: 26.5,
        nScale: 0.25, nOctaves: 1, nPersist: 0.1, nSpeed: 0.16, nWarp: 0.95,
        distortionStrength: 1.0,
        haloReach: 1.9, haloStrength: 0.39, haloCurve: 2.7,
        cycles: 2.0, brightness: 1.0, contrast: 1.0, crush: 5.95, mix: 1.0,
        grainScale: 1, grainGain: 0.11,
        follow: 0   // 1 = circle tracks cursor, 0 = slow autonomous drift
      };

      var VS = "attribute vec2 a_pos;void main(){gl_Position=vec4(a_pos,0,1);}";
      var FS = "\nprecision highp float;\nuniform vec2  u_res;\nuniform float u_time;\nuniform float u_scale;\nuniform int   u_oct;\nuniform float u_persist;\nuniform float u_warp;\nuniform float u_cycles;\nuniform float u_mbStrength;\nuniform float u_bright;\nuniform float u_ncontrast;\nuniform float u_crush;\nuniform float u_mix;\nuniform float u_grainScale;\nuniform float u_grainGain;\nuniform float u_grainTime;\nuniform vec2  u_center;\nuniform float u_radius;\nuniform float u_feather;\nuniform float u_haloReach;\nuniform float u_haloStrength;\nuniform float u_haloCurve;\n\nvec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}\nvec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}\nvec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);}\nvec4 taylorInvSqrt(vec4 r){return 1.79284291400159-.85373472095314*r;}\nfloat snoise(vec3 v){\n  const vec2 C=vec2(1./6.,1./3.);const vec4 D=vec4(0.,.5,1.,2.);\n  vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);\n  vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;\n  vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);\n  vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;\n  i=mod289(i);\n  vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));\n  float n_=.142857142857;vec3 ns=n_*D.wyz-D.xzx;\n  vec4 j=p-49.*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.*x_);\n  vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.-abs(x)-abs(y);\n  vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);\n  vec4 s0=floor(b0)*2.+1.;vec4 s1=floor(b1)*2.+1.;vec4 sh=-step(h,vec4(0.));\n  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;\n  vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);\n  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));\n  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;\n  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);m=m*m;\n  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));\n}\nvec2 rotate2(vec2 v){float c=0.8660254,s=0.5;return vec2(v.x*c-v.y*s,v.x*s+v.y*c);}\nfloat fbm(vec3 p){\n  float v=0.,a=1.,f=1.,m=0.;\n  for(int i=0;i<6;i++){\n    if(i>=u_oct)break;\n    vec2 rxy=rotate2(p.xy*f);\n    v+=snoise(vec3(rxy+vec2(17.3,4.1),p.z*f))*a;\n    m+=a;a*=u_persist;f*=2.;\n  }\n  return v/m;\n}\nfloat hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}\nfloat tri(float x){return fract(x)-.5;}\nfloat dither(vec2 fc){return(tri(fc.x*.5)+tri(fc.y*.5))*(1./255.);}\nfloat grain1(vec2 fc){\n  vec2 gc=floor(fc/max(u_grainScale,1.0));\n  return hash(gc+vec2(u_grainTime*7.3,u_grainTime*3.7));\n}\n\nvoid main(){\n  float d = distance(gl_FragCoord.xy, u_center);\n\n  float softWidth = u_radius * 0.07 + u_feather;\n  float fieldSample = 1.0 - smoothstep(u_radius - softWidth, u_radius + softWidth, d);\n  float signedField = fieldSample - 0.5;\n  vec2 mbOffset = vec2(signedField, signedField) * u_mbStrength * 0.3;\n\n  float haloRange = u_radius * u_haloReach;\n  float rimDist = abs(d - u_radius);\n  float t = clamp(rimDist / haloRange, 0.0, 1.0);\n  float halo = pow(1.0 - t, u_haloCurve);\n  float warpBoost = 1.0 + halo * u_haloStrength * 3.0;\n\n  vec2 uv = gl_FragCoord.xy / u_res;\n  vec2 st = uv * u_scale + vec2(5.3, 2.7);\n  float wx = fbm(vec3(st, u_time));\n  float wy = fbm(vec3(st + vec2(3.7, 1.9), u_time + 1.3));\n  vec2 baseWarp = vec2(wx, wy) * u_warp;\n  vec2 extraWarp = vec2(wx, wy) * u_warp * (warpBoost - 1.0);\n  vec2 warped = st + baseWarp + extraWarp + mbOffset;\n  float n = fbm(vec3(warped, u_time + 0.7));\n  n = n * 0.5 + 0.5;\n\n  float cycled = abs(sin(n * u_cycles * 3.14159));\n  cycled = (cycled - 0.5) * u_ncontrast + 0.5;\n  cycled = clamp(cycled, 0.0, 1.0);\n  cycled = pow(cycled, u_crush);\n  cycled *= u_bright;\n  cycled = clamp(cycled, 0.0, 1.0);\n  cycled += dither(gl_FragCoord.xy);\n  cycled = clamp(cycled, 0.0, 1.0);\n\n  if (u_grainGain > 0.0) {\n    float g = grain1(gl_FragCoord.xy) * 2.0 - 1.0;\n    cycled = clamp(cycled + g * u_grainGain * 0.5, 0.0, 1.0);\n  }\n\n  vec3 cream = vec3(0.812, 0.886, 0.808);\n  gl_FragColor = vec4(mix(vec3(0.0), cream, cycled * u_mix), 1.0);\n}";

      function compile(type, src) {
        var sh = gl.createShader(type);

        return sh;
      }
      var prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
      gl.useProgram(prog);

      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      var aPos = gl.getAttribLocation(prog, "a_pos");
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

      function U(n){ return gl.getUniformLocation(prog, n); }
      var u = {
        res:U("u_res"), time:U("u_time"), scale:U("u_scale"), oct:U("u_oct"),
        persist:U("u_persist"), warp:U("u_warp"), cycles:U("u_cycles"),
        mbStrength:U("u_mbStrength"), bright:U("u_bright"), ncontrast:U("u_ncontrast"),
        crush:U("u_crush"), mix:U("u_mix"), grainScale:U("u_grainScale"),
        grainGain:U("u_grainGain"), grainTime:U("u_grainTime"), center:U("u_center"),
        radius:U("u_radius"), feather:U("u_feather"), haloReach:U("u_haloReach"),
        haloStrength:U("u_haloStrength"), haloCurve:U("u_haloCurve")
      };

      var W = 1, H = 1, baseDim = 1, dpr = 1;
      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        var cw = window.innerWidth, ch = window.innerHeight;
        baseDim = Math.min(cw, ch);
        W = Math.round(cw * dpr); H = Math.round(ch * dpr);
        canvas.width = W; canvas.height = H;
      }
      window.addEventListener("resize", resize);
      resize();

      // pointer → normalised (0..1, y from top); smoothed
      var tpx = 0.5, tpy = 0.5, cpx = 0.5, cpy = 0.5;
      var fine = window.matchMedia("(pointer: fine)").matches;
      if (fine) {
        window.addEventListener("pointermove", function (ev) {
          if (ev.pointerType && ev.pointerType !== "mouse") return;
          tpx = ev.clientX / window.innerWidth;
          tpy = ev.clientY / window.innerHeight;
        }, { passive: true });
      }

      var STORE_KEY = "cactusBgDrift";
      var seed = (function () {
        try { return JSON.parse(sessionStorage.getItem(STORE_KEY) || "null"); } catch (e) { return null; }
      })();
      var nT = Math.random() * 1000, grainT = 0;
      var driftT = (seed && isFinite(seed.driftT)) ? seed.driftT : 0;
      var cpx = (seed && isFinite(seed.cpxN)) ? seed.cpxN : 0.5;
      var cpy = (seed && isFinite(seed.cpyN)) ? seed.cpyN : 0.5;

      function frame() {
        gl.viewport(0, 0, W, H);

        nT += PARAMS.nSpeed * 0.003; if (nT > 1000) nT -= 1000;
        grainT = (grainT + 1) % 100;
        driftT += 0.007;   // dedicated drift clock, starts at 0 (circle begins centred) or resumes from a prior page

        // slow autonomous wander; sines are 0 at t=0 so it starts dead-centre,
        // and the amplitude ramps in over the first few seconds.
        var amp = Math.min(1, driftT / 7.0);
        var driftX = 0.5 + amp * (0.30 * Math.sin(driftT * 0.085) + 0.12 * Math.sin(driftT * 0.021));

        cpy += ((1 - driftY) - cpy) * 0.03;

        window.__bgRadius = PARAMS.cR;                // CSS px — for UI transitions
        try { sessionStorage.setItem(STORE_KEY, JSON.stringify({ driftT: driftT, cpxN: cpx, cpyN: cpy })); } catch (e) {}

        var scaleFactor = Math.min(W, H) / baseDim;
        gl.uniform2f(u.center, cpx * W, (1 - cpy) * H);
        gl.uniform1f(u.radius, PARAMS.cR * scaleFactor);
        gl.uniform1f(u.feather, PARAMS.feather * scaleFactor);
        gl.uniform1f(u.haloReach, PARAMS.haloReach);
        gl.uniform1f(u.haloStrength, PARAMS.haloStrength);
        gl.uniform1f(u.haloCurve, PARAMS.haloCurve);
        gl.uniform2f(u.res, W, H);
        gl.uniform1f(u.time, nT);
        gl.uniform1f(u.scale, PARAMS.nScale);
        gl.uniform1i(u.oct, PARAMS.nOctaves | 0);
        gl.uniform1f(u.persist, PARAMS.nPersist);
        gl.uniform1f(u.warp, PARAMS.nWarp);
        gl.uniform1f(u.cycles, PARAMS.cycles);
        gl.uniform1f(u.bright, PARAMS.brightness);
        gl.uniform1f(u.ncontrast, PARAMS.contrast);
        gl.uniform1f(u.crush, PARAMS.crush);
        gl.uniform1f(u.mix, PARAMS.mix);
        gl.uniform1f(u.mbStrength, PARAMS.distortionStrength);
        gl.uniform1f(u.grainScale, PARAMS.grainScale);
        gl.uniform1f(u.grainGain, PARAMS.grainGain);
        gl.uniform1f(u.grainTime, grainT);

      }
      requestAnimationFrame(frame);
    })();

    /* reveal the hero immediately (no intro) */
    document.body.classList.add("revealed");

  <script>
    /* ---------- "Join our traders" -> the existing hole swallows the screen -> reveal join screen ---------- */
    (function () {
      var btn = document.getElementById("joinBtn");
      var stage = document.querySelector(".stage");
      var scrim = document.querySelector(".scrim");
      var flash = document.getElementById("suckFlash");
      var flashCtx = flash.getContext("2d");
      var joinScreen = document.getElementById("joinScreen");
      if (!btn || !stage) return;
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function clamp01(x) { return Math.max(0, Math.min(1, x)); }
      function smooth(a, b, x) { x = clamp01((x - a) / (b - a)); return x * x * (3 - 2 * x); }

      function resizeFlash() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        flash.width = window.innerWidth * dpr; flash.height = window.innerHeight * dpr;
        flash.style.width = window.innerWidth + "px"; flash.style.height = window.innerHeight + "px";
        flashCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener("resize", resizeFlash);
      resizeFlash();

      function run() {
        if (document.body.classList.contains("warping")) return;
        document.body.classList.add("warping");

        var c = window.__bgCenter || { x: 0.5, y: 0.5 };
        var r0 = window.__bgRadius || 150;
        var cx = c.x * window.innerWidth, cy = c.y * window.innerHeight;
        var corners = [[0,0],[window.innerWidth,0],[0,window.innerHeight],[window.innerWidth,window.innerHeight]];
        var maxR = 0;
        for (var i = 0; i < corners.length; i++) {
          maxR = Math.max(maxR, Math.hypot(corners[i][0] - cx, corners[i][1] - cy));
        }
        maxR *= 1.08;   // small margin so the feathered edge fully clears the corners
        var swapped = false;

        if (reduce) {
          stage.style.transition = "opacity 0.3s ease";
          stage.style.opacity = "0";
          setTimeout(function () {
            stage.style.display = "none";
            joinScreen.classList.add("show");
            joinScreen.style.opacity = "1";
          }, 300);
          return;
        }

        var DUR = 1900;
        var t0 = performance.now();
        function frame(now) {
          var p = Math.min(1, (now - t0) / DUR);

          // hero: plain fade in place (no travel/scale)
          var heroFade = smooth(0, 0.32, p);
          stage.style.opacity = String(1 - heroFade);
          stage.style.filter = "blur(" + (heroFade * 4).toFixed(2) + "px)";
          scrim.style.opacity = String(1 - smooth(0, 0.5, p));

          // the EXISTING hole grows outward from its own current size/position
          // to swallow the whole screen — no separate/disconnected glow shape.
          var grow = smooth(0.18, 0.82, p);
          var r = r0 + (maxR - r0) * grow;
          var coreIn = smooth(0.1, 0.42, p);
          var coreOut = smooth(0.86, 1.0, p);
          var alpha = coreIn * (1 - coreOut);
          var feather = Math.max(24, r * 0.22);

          flashCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
          if (alpha > 0.003) {
            var peak = alpha * 0.85;   // stay translucent — let the shader's own texture read through
            var g = flashCtx.createRadialGradient(cx, cy, Math.max(0, r - feather), cx, cy, r);
            g.addColorStop(0, "rgba(207,226,206," + peak.toFixed(3) + ")");
            g.addColorStop(0.65, "rgba(207,226,206," + (peak * 0.7).toFixed(3) + ")");
            g.addColorStop(1, "rgba(207,226,206,0)");
            flashCtx.fillStyle = g;
            flashCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);
          }

          // swap to the join screen once the disk has swallowed the view
          if (!swapped && p >= 0.66) {
            swapped = true;
            stage.style.display = "none";
            joinScreen.classList.add("show");
            joinScreen.style.opacity = "1";
          }

          if (p < 1) { requestAnimationFrame(frame); }
          else { flashCtx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
        }
        requestAnimationFrame(frame);
      }

      btn.addEventListener("click", run);
    })();
  </script>

  <script>
    /* ---------- market cards → Supabase "markets" Edge Function ---------- */
    (function () {
      var ENDPOINT = "https://gpcbvuwfpxkjtrcabzqw.supabase.co/functions/v1/markets";
      var SUPABASE_KEY = "sb_publishable_wkgmUjXRt2nxRDARGTAjug_RPXZsoj1";
      var SVG = "http://www.w3.org/2000/svg";
      var wrap = document.getElementById("markets");
      if (!wrap) return;

      function fmtPrice(v, unit) {
        if (unit === "%") return v.toFixed(2) + "%";
        var opts = v >= 1000 ? { maximumFractionDigits: 0 } : { minimumFractionDigits: 2, maximumFractionDigits: 2 };
        return (unit === "$" ? "$" : "") + v.toLocaleString("en-US", opts);
      }
      function fmtChg(v) { return (v >= 0 ? "+" : "") + v.toFixed(2) + "%"; }

      // mini sparkline: price line (green/red) + a thin bluish previous-close line
      function buildSpark(series, prevClose, up, breaks, open) {
        var W = 100, H = 34;
        var n = series.length;
        var wrap = document.createElement("div");
        wrap.className = "spark-wrap";
        var svg = document.createElementNS(SVG, "svg");
        svg.setAttribute("class", "mkt-spark");
        svg.setAttribute("viewBox", "0 0 " + W + " " + H);
        svg.setAttribute("preserveAspectRatio", "none");
        var vals = series.slice();
        if (isFinite(prevClose)) vals.push(prevClose);
        var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
        var pad = (max - min) * 0.12 || (Math.abs(max) * 0.01) || 1;
        min -= pad; max += pad;
        var span = (max - min) || 1;
        function y(v) { return (H - (v - min) / span * H); }
        // silver dashed vertical line at each day cutoff
        if (breaks && breaks.length && n > 1) {
          for (var b = 0; b < breaks.length; b++) {
            var bi = breaks[b];
            if (bi <= 0 || bi >= n) continue;
            var vx = (bi / (n - 1) * W).toFixed(2);
            var vl = document.createElementNS(SVG, "line");
            vl.setAttribute("x1", vx); vl.setAttribute("x2", vx);
            vl.setAttribute("y1", "0"); vl.setAttribute("y2", String(H));
            vl.setAttribute("class", "spark-daybreak");
            svg.appendChild(vl);
          }
        }
        // dotted previous-close reference line
        if (isFinite(prevClose)) {
          var ln = document.createElementNS(SVG, "line");
          ln.setAttribute("x1", "0"); ln.setAttribute("x2", String(W));
          ln.setAttribute("y1", y(prevClose).toFixed(2)); ln.setAttribute("y2", y(prevClose).toFixed(2));
          ln.setAttribute("class", "spark-prev");
          svg.appendChild(ln);
        }
        if (n > 1) {
          var pts = [];
          for (var i = 0; i < n; i++) pts.push((i / (n - 1) * W).toFixed(2) + "," + y(series[i]).toFixed(2));
          var pl = document.createElementNS(SVG, "polyline");
          pl.setAttribute("points", pts.join(" "));
          pl.setAttribute("class", "spark-line " + (up ? "up" : "down"));
          svg.appendChild(pl);
        }
        wrap.appendChild(svg);
        // pulsing dot at the latest point (HTML element so it stays round)
        if (n >= 1) {
          var dot = document.createElement("span");
          dot.className = "spark-dot " + (up ? "up" : "down") + (open ? " live" : "");
          dot.style.top = (y(series[n - 1]) / H * 100).toFixed(1) + "%";
          wrap.appendChild(dot);
        }
        return wrap;
      }

      function tile(it) {
        var up = it.changePct >= 0;
        var el = document.createElement("div");
        el.className = "mkt-tile";
        var head = document.createElement("div"); head.className = "mkt-head";
        var lbl = document.createElement("span"); lbl.className = "mkt-label"; lbl.textContent = it.label;
        var pr = document.createElement("span"); pr.className = "mkt-price"; pr.textContent = fmtPrice(it.price, it.unit);
        var ch = document.createElement("span"); ch.className = "mkt-chg " + (up ? "up" : "down"); ch.textContent = fmtChg(it.changePct);
        head.appendChild(lbl); head.appendChild(pr); head.appendChild(ch);
        el.appendChild(head);
        if (it.series && it.series.length > 1) el.appendChild(buildSpark(it.series, it.prevClose, up, it.breaks, it.open));
        return el;
      }

      function render(items) {
        wrap.textContent = "";
        if (!items || !items.length) {
          var e = document.createElement("div"); e.className = "markets-empty";
          e.textContent = "Markets unavailable right now.";
          wrap.appendChild(e); return;
        }
        for (var i = 0; i < items.length; i++) wrap.appendChild(tile(items[i]));
      }

      function load() {
        fetch(ENDPOINT, {
          method: "GET",
          headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
        })
          .then(function (r) { return r.json().catch(function () { return {}; }); })
          .then(function (data) { render(data && data.items); })
          .catch(function () { /* keep last-rendered content on transient errors */ });
      }
      load();
      setInterval(load, 60000);
    })();
  </script>
